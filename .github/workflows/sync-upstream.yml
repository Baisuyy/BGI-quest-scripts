name: Sync Upstream BGI

# 每天定时（或手动）把上游 babalae/better-genshin-impact 的默认分支同步进 bgi-special。
# bgi-special 是单提交的源码快照（不带上游历史，避免脚本仓库膨胀），
# 因此同步方式为「覆盖上游源码 + 重新注入特别版改动」，而不是 git merge。
run-name: "Sync upstream ${{ inputs.upstream_ref || 'auto' }}"

on:
  schedule:
    - cron: "17 21 * * *" # 北京时间每天 05:17
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支或标签（留空自动探测默认分支）"
        required: false
        type: string
      build_after_sync:
        description: "同步成功后立即触发特别版构建"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出 bgi-special
        uses: actions/checkout@v4
        with:
          ref: bgi-special
          fetch-depth: 1

      - name: 拉取上游快照
        id: up
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          URL="https://github.com/babalae/better-genshin-impact.git"
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --symref "$URL" HEAD \
                  | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
          fi
          echo "上游分支：$REF"

          if ! git clone --quiet --depth 1 --branch "$REF" "$URL" /tmp/upstream 2>/dev/null; then
            git clone --quiet --depth 1 "$URL" /tmp/upstream
            git -C /tmp/upstream fetch --quiet --depth 1 origin "$REF"
            git -C /tmp/upstream checkout --quiet FETCH_HEAD
          fi

          SHA=$(git -C /tmp/upstream rev-parse --short HEAD)
          FULL=$(git -C /tmp/upstream rev-parse HEAD)
          OLD=$(cat .bgi-upstream 2>/dev/null || echo none)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "本地记录 $OLD，上游 $SHA"

          # 上次同步的上游快照，给核心文件三方比较当 base。
          # .bgi-upstream 以前存的是短 sha，按 sha fetch 需要完整 40 位；
          # 取不到就跳过比对（打警告），不会因此拦下正常同步。
          if [ "$OLD" != "none" ] && [ "$OLD" != "$FULL" ]; then
            if git -C /tmp/upstream fetch --quiet --depth 1 origin "$OLD" 2>/dev/null; then
              mkdir -p /tmp/upstream-base
              git -C /tmp/upstream archive "$OLD" | tar -x -C /tmp/upstream-base
              echo "已取到上次上游快照 ${OLD:0:7}"
            else
              echo "::warning::取不到上次上游快照 ${OLD}，本轮跳过核心文件比对"
            fi
          fi
          # .bgi-upstream 现在存完整 sha（三方比较要按 sha fetch），旧值是短 sha
          OLD_SHORT=$(echo "$OLD" | cut -c1-7)
          if [ "$OLD_SHORT" = "$SHA" ]; then
            echo "state=noop" >> "$GITHUB_OUTPUT"
          else
            echo "state=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: 覆盖源码并重新注入
        if: ${{ steps.up.outputs.state == 'changed' }}
        id: apply
        run: |
          set -euo pipefail
          python3 tools/bgi-special/sync_source.py /tmp/upstream /tmp/upstream-base
          python3 tools/bgi-special/patch_special.py
          python3 tools/bgi-special/apply_upstream_extra.py
          # 推送前先验一遍特别版的东西还在。这一步不过就不推——
          # 2026-11-20 那次同步「成功推送」但分支编不过，问题在第二天才被发现。
          python3 tools/bgi-special/verify_special.py
          echo "${{ steps.up.outputs.full_sha }}" > .bgi-upstream

      # 核心文件撞车时 sync_source.py 会退出 4，不提交。diff 留在 sync-review/，
      # 这里传成 artifact，日志里看不到的上下文可以直接下载。
      - name: 保留核心文件冲突 diff
        if: ${{ failure() && steps.up.outputs.state == 'changed' }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-review
          path: sync-review/
          if-no-files-found: ignore
          retention-days: 30

      - name: 提交并推送
        if: ${{ steps.up.outputs.state == 'changed' }}
        id: push
        env:
          REF: ${{ steps.up.outputs.ref }}
          SHA: ${{ steps.up.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "bgi-special-bot"
          git config user.email "bgi-special-bot@users.noreply.github.com"
          git add -A

          # 闸门：提交里不许出现 .github/workflows 的改动。
          # GITHUB_TOKEN 没有 workflow 文件写权限（这是 GitHub 的硬限制，
          # permissions 里根本没有对应的 key，设 "Read and write" 也没用），
          # 一旦带上就是 push 被 remote rejected，日志里只有 exit code 1。
          WF=$(git diff --cached --name-only -- '.github/workflows/' || true)
          if [ -n "$WF" ]; then
            {
              echo "PUSH_ERR<<EOF"
              echo "提交里带上了 .github/workflows 的改动，GITHUB_TOKEN 无权推送："
              printf '%s\n' "$WF"
              echo ""
              echo "上游改了自己的 workflow，而 sync_source.py 的 KEEP 没挡住。"
              echo "处理：确认 .github/workflows/ 仍在 KEEP 里；上游的 CI 对特别版没用，不要同步。"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            printf '%s\n' "$WF" >&2
            exit 1
          fi

          git commit -q -m "chore(sync): 同步上游 ${REF} @ ${SHA}" --allow-empty
          if ! git push origin HEAD:bgi-special > /tmp/push.log 2>&1; then
            tail -n 30 /tmp/push.log >&2
            {
              echo "PUSH_ERR<<EOF"
              echo "git push 被远端拒绝，原始输出："
              tail -n 30 /tmp/push.log
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 触发特别版构建
        if: ${{ steps.push.outputs.pushed == 'true' && (github.event_name == 'schedule' || inputs.build_after_sync) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只构建、不发版：不填 version 时 build-special 会用 `$GITHUB_RUN_NUMBER` 当尾号，
          # 同步一次就凭空多出 special.100 这种号，还比人发的版本大；发布页于是同时有
          # 0.67.0-special.7.3 与 0.67.1-special.7.2 两条线，客户端每次同步都弹更新。
          # 发版改由推 special-v* 标签决定，这里只验证「同步完还能编译」。
          gh workflow run build-special.yml --ref main -f ref=bgi-special -f make_release=false
          echo "已触发构建（不发 Release）"

      - name: 同步失败时开 issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.up.outputs.ref }}
          SHA: ${{ steps.up.outputs.sha }}
          PUSH_ERR: ${{ steps.push.outputs.PUSH_ERR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '%s\n' \
            "自动同步上游 \`${REF}\`（${SHA}）失败，源码未推送。" \
            "" \
            "常见原因：上游改动了 \`EngineExtend.InitHost\`、\`PathExecutor\` 的任务循环或任务设置页的结构，补丁锚点匹配不到；" \
            "或 \`VisionHost.cs\` 依赖的接口（\`ImageRegion\` / \`OcrFactory\` / \`IOcrService\`）签名变化。" \
            "" \
            "\`verify_special.py\` 报错时看它列出的具体条目：能力层文件被删就补 \`sync_source.py\` 的 KEEP；" \
            "补丁标记缺失就看 \`patch_special.py\` 对应那条的锚点；" \
            "上游文件里出现特别版字段，说明有人把它写回了会被覆盖的地方，要搬到同名 \`*.Special.cs\`。" \
            "" \
            "如果是核心文件冲突（日志出现「核心文件的改动与上游撞车」），说明双方改到了同一段：" \
            "到本次运行的 Artifacts 下载 \`sync-review\`，照着 diff 决定补丁是挪位置还是放弃，改完重跑。" \
            "" \
            "处理方式：本地按 SPECIAL-API.md 的说明调整" \
            "\`tools/bgi-special/patch_special.py\`、\`tools/bgi-special/apply_upstream_extra.py\`、\`Core/Ai/\` 或 \`VisionHost.cs\`，再手动跑一次同步。" \
            "" \
            "构建日志：${RUN_URL}")
          # push 那一步的原始报错，比上面这份通用排查清单有用得多
          if [ -n "${PUSH_ERR:-}" ]; then
            BODY=$(printf '%s\n\n%s\n%s\n%s\n' "$BODY" "---" '```' "${PUSH_ERR}")
            BODY=$(printf '%s\n%s\n' "$BODY" '```')
          fi
          EXIST=$(gh issue list --state open --search "上游同步失败 in:title" \
                  --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "上游同步失败（${REF} @ ${SHA}）" --body "$BODY"
          fi

      - name: 汇总
        if: always()
        run: |
          {
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游分支 | ${{ steps.up.outputs.ref }} |"
            echo "| 上游 HEAD | ${{ steps.up.outputs.sha }} |"
            echo "| 结果 | ${{ steps.up.outputs.state }} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI 编译检查

# 临时分支专用：只编译，不打包、不发 Release。
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 编译客户端
        shell: pwsh
        run: |
          dotnet build BetterGenshinImpact/BetterGenshinImpact.csproj `
            -c Release `
            --nologo `
            -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { throw "编译失败，退出码 $LASTEXITCODE" }

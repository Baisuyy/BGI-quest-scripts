name: Build BGI Special

# 特别版客户端构建：只手动触发（workflow_dispatch），可选分支/版本/是否发 Release。
# 推代码不再自动构建；每日上游同步成功后由 sync-upstream.yml 显式派发一次。
run-name: "BGI Special ${{ inputs.version || format('build-{0}', github.run_number) }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或标签"
        required: true
        default: "bgi-special"
        type: string
      version:
        description: "版本号（留空 = csproj 版本 + -special.<构建号>）"
        required: false
        type: string
      make_release:
        description: "构建完成后创建 GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # 构建很重，手动触发与同步派发共用一组，避免两个 runner 同时打包
  group: build-special
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 计算版本号
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $csproj = 'BetterGenshinImpact/BetterGenshinImpact.csproj'
          $m = Select-String -Path $csproj -Pattern '<Version>([^<]+)</Version>'
          if (-not $m) { throw '未能从 csproj 读取 <Version>' }
          $base = $m.Matches[0].Groups[1].Value
          $override = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($override)) {
              $version = "$base-special.$env:GITHUB_RUN_NUMBER"
          } else {
              $version = $override.Trim()
          }
          "base=$base"       >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
          Write-Host "构建版本：$version（基线 $base）"

      - name: 编译并发布
        shell: pwsh
        run: |
          dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj `
            -c Release `
            -p:PublishProfile=FolderProfile `
            -p:Version=${{ steps.ver.outputs.version }} `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败，退出码 $LASTEXITCODE" }

      - name: 整理并打包
        id: pack
        shell: pwsh
        run: |
          $src = 'BetterGenshinImpact/bin/x64/Release/net10.0-windows10.0.22621.0/publish/win-x64'
          if (-not (Test-Path "$src/BetterGI.exe")) { throw "未找到 $src/BetterGI.exe" }

          # 与官方发布一致：剔除符号文件与 ffmpeg 运行库
          Get-ChildItem $src -Recurse -Include *.pdb, *.lib -File | Remove-Item -Force
          Get-ChildItem $src -Recurse -Filter '*ffmpeg*.dll' -File | Remove-Item -Force

          New-Item -ItemType Directory -Path 'dist/BetterGI' -Force | Out-Null
          Copy-Item "$src/*" 'dist/BetterGI' -Recurse -Force

          $v = '${{ steps.ver.outputs.version }}'
          $name = "BetterGI_v${v}_special-win-x64.7z"
          Push-Location dist
          7z a $name 'BetterGI' -t7z -mx=5 -mf=BCJ2 -r -y | Out-Null
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z 打包失败，退出码 $code" }

          $archive = "dist/$name"
          $sizeMB = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sizeMB=$sizeMB"   >> $env:GITHUB_OUTPUT
          Write-Host "压缩包：$archive（$sizeMB MB）"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BetterGI-special-${{ steps.ver.outputs.version }}
          path: ${{ steps.pack.outputs.archive }}
          retention-days: 14
          compression-level: 0

      - name: 创建 Release
        if: ${{ inputs.make_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
          SHA: ${{ steps.ver.outputs.sha }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          SIZE_MB: ${{ steps.pack.outputs.sizeMB }}
          REF: ${{ inputs.ref || 'bgi-special' }}
          FULL_SHA: ${{ github.sha }}
        run: |
          $tag = "special-v$env:VERSION"

          $notes = Get-Content '.github/release-notes-template.md' -Raw
          $notes = $notes.Replace('{{VERSION}}', $env:VERSION)
          $notes = $notes.Replace('{{BASE}}', $env:BASE)
          $notes = $notes.Replace('{{REF}}', $env:REF)
          $notes = $notes.Replace('{{SHA}}', $env:SHA)
          $notes | Out-File -FilePath 'RELEASE_NOTES.md' -Encoding utf8

          gh release delete $tag -y --cleanup-tag 2>$null
          gh release create $tag `
            $env:ARCHIVE `
            (Join-Path (Get-Location) 'dist/BetterGI/BetterGI.exe') `
            --target $env:FULL_SHA `
            --title "BetterGI 特别版 $env:VERSION" `
            --notes-file 'RELEASE_NOTES.md' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release 创建失败，退出码 $LASTEXITCODE" }
          Write-Host "已发布 $tag（压缩包 $env:SIZE_MB MB）"

      - name: 写入运行摘要
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            "| 项目 | 值 |",
            "| --- | --- |",
            "| 版本 | ${{ steps.ver.outputs.version }} |",
            "| 上游基线 | ${{ steps.ver.outputs.base }} |",
            "| 源码 ref | ${{ inputs.ref || github.ref_name }} |",
            "| 压缩包 | ${{ steps.pack.outputs.archive }} |",
            "| 体积 | ${{ steps.pack.outputs.sizeMB }} MB |"
          )
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

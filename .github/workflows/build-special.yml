name: Build BGI Special

# 特别版客户端构建：手动触发（workflow_dispatch），可选分支/版本/是否发 Release。
# 推代码不构建；但推 special-v* 标签会直接走同一套流程，版本号取自标签名。
# 每日上游同步成功后由 sync-upstream.yml 显式派发一次。
run-name: "BGI Special ${{ inputs.version || github.ref_name }}"

on:
  push:
    tags:
      - "special-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或标签"
        required: true
        default: "bgi-special"
        type: string
      version:
        description: "版本号（留空 = csproj 版本 + -special.<构建号>）"
        required: false
        type: string
      make_release:
        description: "构建完成后创建 GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # 构建很重，手动触发与同步派发共用一组，避免两个 runner 同时打包
  group: build-special
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 官方发布流水线会把两个前端产物塞进 Assets：脚本仓库页与地图编辑器页。
  # 特别版漏了这一步，客户端打开「脚本仓库」时 WebView2 找不到目录，
  # SetVirtualHostNameToFolderMapping 抛 0x80070003，窗口直接空白。
  # 前端构建失败不阻断客户端出包，代码侧有缺目录兜底。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: 构建脚本仓库页
        id: scripts
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: zaodonganqi/bettergi-script-web

      - name: 安装 Node
        if: ${{ steps.scripts.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 打包脚本仓库页
        if: ${{ steps.scripts.outcome == 'success' }}
        continue-on-error: true
        run: npm install && npm run build:single

      - name: 上传脚本仓库页
        if: ${{ steps.scripts.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web_scripts_list
          path: dist/
          if-no-files-found: warn
          retention-days: 3

      - name: 检出地图编辑器
        id: map
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: huiyadanli/bettergi-map
          path: map

      - name: 打包地图编辑器
        if: ${{ steps.map.outcome == 'success' }}
        continue-on-error: true
        run: cd map && npm install && npm run build:single

      - name: 上传地图编辑器
        if: ${{ steps.map.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web_map_editor
          path: map/dist/
          if-no-files-found: warn
          retention-days: 3

  build:
    needs: [web]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        id: src
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 计算版本号
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $csproj = 'BetterGenshinImpact/BetterGenshinImpact.csproj'
          $m = Select-String -Path $csproj -Pattern '<Version>([^<]+)</Version>'
          if (-not $m) { throw '未能从 csproj 读取 <Version>' }
          $base = $m.Matches[0].Groups[1].Value

          $override = $env:INPUT_VERSION
          # 推标签触发时没有 inputs，版本号直接取标签名：special-v0.67.0-special.7 → 0.67.0-special.7
          if ([string]::IsNullOrWhiteSpace($override) -and
              $env:REF_TYPE -eq 'tag' -and $env:REF_NAME -like 'special-v*') {
              $override = $env:REF_NAME.Substring('special-v'.Length)
              Write-Host "版本号取自标签：$env:REF_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($override)) {
              $version = "$base-special.$env:GITHUB_RUN_NUMBER"
          } else {
              $version = $override.Trim()
          }
          "base=$base"       >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
          Write-Host "构建版本：$version（基线 $base）"

      - name: 编译并发布
        shell: pwsh
        run: |
          dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj `
            -c Release `
            -p:PublishProfile=FolderProfile `
            -p:Version=${{ steps.ver.outputs.version }} `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败，退出码 $LASTEXITCODE" }

      # 前端产物先落到 dist，随下面的 Copy-Item 一起进包。取不到就跳过，
      # 客户端会退化成可读提示而不是白屏。
      - name: 取脚本仓库页
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web_scripts_list
          path: dist/BetterGI/Assets/Web/ScriptRepo

      - name: 取地图编辑器页
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web_map_editor
          path: dist/BetterGI/Assets/Map/Editor

      - name: 整理并打包
        id: pack
        shell: pwsh
        run: |
          $src = 'BetterGenshinImpact/bin/x64/Release/net10.0-windows10.0.22621.0/publish/win-x64'
          if (-not (Test-Path "$src/BetterGI.exe")) { throw "未找到 $src/BetterGI.exe" }

          # 与官方发布一致：剔除符号文件与 ffmpeg 运行库
          Get-ChildItem $src -Recurse -Include *.pdb, *.lib -File | Remove-Item -Force
          Get-ChildItem $src -Recurse -Filter '*ffmpeg*.dll' -File | Remove-Item -Force

          New-Item -ItemType Directory -Path 'dist/BetterGI' -Force | Out-Null
          Copy-Item "$src/*" 'dist/BetterGI' -Recurse -Force

          $v = '${{ steps.ver.outputs.version }}'
          $name = "BetterGI_v${v}_special-win-x64.7z"
          Push-Location dist
          7z a $name 'BetterGI' -t7z -mx=5 -mf=BCJ2 -r -y | Out-Null
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z 打包失败，退出码 $code" }

          $archive = "dist/$name"
          $sizeMB = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sizeMB=$sizeMB"   >> $env:GITHUB_OUTPUT
          Write-Host "压缩包：$archive（$sizeMB MB）"

      - name: 下载 kachina-builder
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "YuehaiTeam/kachina-installer"
          latest: true
          fileName: "kachina-builder.exe"

      - name: 用 Kachina 生成安装包
        id: sfx
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          if (-not (Test-Path 'kachina-builder.exe')) { throw 'kachina-builder.exe 未下载成功' }

          # 断言更新源：这份 config 一旦误用成官方那份，特别版用户点「检查更新」
          # 就会被拉回官方版（版本号更低、功能更少），而且卸载信息也会指向官方。
          $cfg = Get-Content 'Build\kachina.special.config.json' -Raw | ConvertFrom-Json
          $bad = @($cfg.source | Where-Object { $_.uri -match 'babalae|cocogoat|bettergi/better-genshin-impact' })
          if ($bad.Count -gt 0) {
              throw "kachina.special.config.json 里有指向官方上游的更新源：$($bad.id -join ', ')"
          }
          $own = @($cfg.source | Where-Object { $_.uri -match 'Baisuyy/BGI-quest-scripts' })
          if ($own.Count -eq 0) {
              throw 'kachina.special.config.json 没有指向本仓库的更新源，装完的包无法自动更新'
          }
          Write-Host "更新源校验通过：$($own.id -join ', ')"

          # 先把内置更新器放进待打包目录：装完之后程序自己「检查更新」用的就是它
          & .\kachina-builder.exe pack -c Build\kachina.special.config.json -o dist/BetterGI/BetterGI.update.exe
          if ($LASTEXITCODE -ne 0) { throw "生成内置更新器失败，退出码 $LASTEXITCODE" }

          Push-Location dist
          try {
              # gen 生成带哈希的安装清单，-r 指定更新仓库，-u 指定随包分发的更新器
              ..\kachina-builder.exe gen -j 6 -i BetterGI -m metadata.json -o hashed `
                  -r Baisuyy/BGI-quest-scripts -t $v -u .\BetterGI\BetterGI.update.exe
              if ($LASTEXITCODE -ne 0) { throw "kachina gen 失败，退出码 $LASTEXITCODE" }

              $setup = "BetterGI.Install.$v.exe"
              ..\kachina-builder.exe pack -c ..\Build\kachina.special.config.json -m metadata.json -d hashed -o $setup
              if ($LASTEXITCODE -ne 0) { throw "kachina pack 失败，退出码 $LASTEXITCODE" }
          } finally { Pop-Location }

          $setupPath = "dist/BetterGI.Install.$v.exe"
          if (-not (Test-Path $setupPath)) { throw "安装包没有生成：$setupPath" }
          $sizeMB = [math]::Round((Get-Item $setupPath).Length / 1MB, 1)
          "setup=$setupPath" >> $env:GITHUB_OUTPUT
          "setupMB=$sizeMB" >> $env:GITHUB_OUTPUT
          Write-Host "Kachina 安装包：$setupPath（$sizeMB MB）"

      # 增量包：只装与上一个 special 版本不同的文件。
      # 完整包 546 MB，走 GitHub 代理镜像下载常常只有几百 KB/s，而一次发版真正变的通常只有
      # 主程序 DLL 与前端产物（几十 MB 以内），所以让客户端优先下这个包。
      - name: 生成增量包
        id: patch
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cur = '${{ steps.ver.outputs.version }}'
          $repo = '${{ github.repository }}'

          # 本轮 Release 还没创建，列表里第一条 special 就是上一个版本
          # 排除本次自己的 tag：重跑失败任务时上一次可能已经建过同名 Release
          $listRaw = gh release list --repo $repo --limit 30 --json tagName,createdAt
          if ($LASTEXITCODE -ne 0) { throw "gh release list 失败，退出码 $LASTEXITCODE" }
          Write-Host "release 列表：$listRaw"

          $prevTag = ($listRaw | ConvertFrom-Json |
              Where-Object { $_.tagName -like 'special-v*' -and $_.tagName -ne "special-v$cur" } |
              Sort-Object createdAt -Descending |
              Select-Object -First 1).tagName
          if (-not $prevTag) { Write-Host '没有可对比的历史版本，跳过增量包'; exit 0 }
          $prevVer = $prevTag.Substring('special-v'.Length)
          Write-Host "对比基准：$prevTag"

          gh release download $prevTag --repo $repo --pattern '*special-win-x64.7z' --dir dist/prev --clobber
          if ($LASTEXITCODE -ne 0) { throw "下载 $prevTag 失败，退出码 $LASTEXITCODE" }
          Write-Host "已下载：$((Get-ChildItem 'dist/prev').Name -join ', ')"
          $prevArchive = Get-ChildItem 'dist/prev' -Filter '*.7z' | Select-Object -First 1
          7z x $prevArchive.FullName "-odist/prev/extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "解压上一个版本失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path 'dist/prev/extract/BetterGI')) {
              # 压缩包里可能没有 BetterGI 顶层目录，找一层下钻
              $found = Get-ChildItem 'dist/prev/extract' -Directory | Select-Object -First 1
              if ($found) { Move-Item $found.FullName 'dist/prev/extract/BetterGI' }
          }
          if (-not (Test-Path 'dist/prev/extract/BetterGI')) { throw '解压后找不到 BetterGI 目录' }

          $newRoot = (Resolve-Path 'dist/BetterGI').Path
          $oldRoot = (Resolve-Path 'dist/prev/extract/BetterGI').Path

          $files = New-Object System.Collections.Generic.List[object]
          $removed = New-Object System.Collections.Generic.List[string]

          foreach ($f in Get-ChildItem $newRoot -Recurse -File) {
              $rel = $f.FullName.Substring($newRoot.Length).TrimStart('\')
              $old = Join-Path $oldRoot $rel
              $hash = $null
              if (Test-Path $old) {
                  # 大小相同才值得算哈希，省掉大半磁盘读取
                  if ((Get-Item $old).Length -eq $f.Length) {
                      $a = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
                      $b = (Get-FileHash $old -Algorithm SHA256).Hash
                      if ($a -eq $b) { continue }
                      $hash = $a
                  }
              }
              if (-not $hash) { $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash }
              $files.Add([ordered]@{ path = $rel; size = $f.Length; sha256 = $hash })
          }

          foreach ($f in Get-ChildItem $oldRoot -Recurse -File) {
              $rel = $f.FullName.Substring($oldRoot.Length).TrimStart('\')
              if (-not (Test-Path (Join-Path $newRoot $rel))) { $removed.Add($rel) }
          }

          $stage = 'dist/patch'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$stage/files" -Force | Out-Null
          foreach ($item in $files) {
              $dest = Join-Path "$stage/files" $item.path
              New-Item -ItemType Directory (Split-Path $dest -Parent) -Force | Out-Null
              Copy-Item (Join-Path $newRoot $item.path) $dest -Force
          }

          $manifest = [ordered]@{
              from    = $prevVer
              to      = $cur
              base    = 'BetterGI'
              files   = @($files)
              removed = @($removed)
          }
          $manifest | ConvertTo-Json -Depth 6 | Out-File "$stage/manifest.json" -Encoding utf8

          $patchName = "BetterGI_v${cur}_patch-from-$prevVer.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$patchName" -CompressionLevel Optimal
          $patchMB = [math]::Round((Get-Item "dist/$patchName").Length / 1MB, 1)
          "patch=dist/$patchName" >> $env:GITHUB_OUTPUT
          "patchMB=$patchMB"      >> $env:GITHUB_OUTPUT
          Write-Host "增量包：$patchName（$patchMB MB，变更 $($files.Count) 个、删除 $($removed.Count) 个）"
          Write-Host "资产文件名：$patchName"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BetterGI-special-${{ steps.ver.outputs.version }}
          path: ${{ steps.pack.outputs.archive }}
          retention-days: 14
          compression-level: 0

      - name: 创建 Release
        # 手动触发看勾选；推标签触发时没有 inputs，按标签语义一律发布
        if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/special-v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
          SHA: ${{ steps.ver.outputs.sha }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          SIZE_MB: ${{ steps.pack.outputs.sizeMB }}
          SETUP: ${{ steps.sfx.outputs.setup }}
          SETUP_MB: ${{ steps.sfx.outputs.setupMB }}
          PATCH: ${{ steps.patch.outputs.patch }}
          PATCH_MB: ${{ steps.patch.outputs.patchMB }}
          REF: ${{ inputs.ref || github.ref_name }}
          # 构建的源码在 inputs.ref，未必是触发分支：用 --ref main 触发时 github.sha 是 main 的提交，
          # 直接拿它当 target 会把 tag 打到 main 上（脚本仓库内容），而不是这次构建的客户端源码
          FULL_SHA: ${{ steps.src.outputs.commit }}
        run: |
          $tag = "special-v$env:VERSION"

          $notes = Get-Content '.github/release-notes-template.md' -Raw
          $notes = $notes.Replace('{{VERSION}}', $env:VERSION)
          $notes = $notes.Replace('{{BASE}}', $env:BASE)
          $notes = $notes.Replace('{{REF}}', $env:REF)
          $notes = $notes.Replace('{{SHA}}', $env:SHA)
          $notes | Out-File -FilePath 'RELEASE_NOTES.md' -Encoding utf8

          # 先建空壳再逐个上传：一次带上 1.3GB 资产容易在中途断流，
          # 断在这里只能得到半成品 Release，且重跑会重复占用 tag。
          gh release delete $tag -y --cleanup-tag 2>$null
          gh release create $tag `
            --target $env:FULL_SHA `
            --title "BetterGI 特别版 $env:VERSION" `
            --notes-file 'RELEASE_NOTES.md' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release 创建失败，退出码 $LASTEXITCODE" }

          $assets = @(
            $env:ARCHIVE,
            $env:SETUP,
            (Join-Path (Get-Location) 'dist/BetterGI/BetterGI.exe')
          )
          # 增量包允许缺失（对比失败时不会生成），有就一起传
          if ($env:PATCH -and (Test-Path $env:PATCH)) { $assets += (Resolve-Path $env:PATCH).Path }
          $expected = $assets.Count
          foreach ($asset in $assets) {
              if (-not (Test-Path $asset)) { throw "资产缺失：$asset" }
              $ok = $false
              for ($i = 1; $i -le 3; $i++) {
                  gh release upload $tag $asset --clobber
                  if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                  Write-Host "上传 $asset 第 $i 次失败，退避 $($i * 15) 秒后重试"
                  Start-Sleep -Seconds ($i * 15)
              }
              if (-not $ok) { throw "资产上传失败：$asset" }
              $mb = [math]::Round((Get-Item $asset).Length / 1MB, 1)
              Write-Host "已上传 $(Split-Path $asset -Leaf)（$mb MB）"
          }

          $listed = gh release view $tag --json assets --jq '.assets | length'
          if ($lastExitCode -ne 0 -or [int]$listed -ne $expected) { throw "资产数量异常：$listed（期望 $expected）" }
          $patchInfo = if ([string]::IsNullOrWhiteSpace($env:PATCH_MB)) { "未生成" } else { "$env:PATCH_MB MB" }
          Write-Host "已发布 $tag（7z $env:SIZE_MB MB / 安装包 $env:SETUP_MB MB / 增量包 $patchInfo / 资产 $listed 个）"

      - name: 上传到 123 云盘
        # 放在 Release 之后：这边失败不影响 GitHub 侧已经完成的发布
        if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/special-v') }}
        continue-on-error: true
        shell: pwsh
        env:
          PAN123_WEBDAV_USER: ${{ secrets.PAN123_WEBDAV_USER }}
          PAN123_WEBDAV_PASS: ${{ secrets.PAN123_WEBDAV_PASS }}
          PAN123_WEBDAV_URL: ${{ secrets.PAN123_WEBDAV_URL }}
          PAN123_WEBDAV_ROOT: ${{ secrets.PAN123_WEBDAV_ROOT }}
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
          PAN123_PARENT_ID: ${{ secrets.PAN123_PARENT_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          SETUP: ${{ steps.sfx.outputs.setup }}
        run: |
          # 两条通道：WebDAV（需历史会员权益）优先，没有就退回开放平台应用密钥
          $hasWebdav = (-not [string]::IsNullOrWhiteSpace($env:PAN123_WEBDAV_USER)) -and
                       (-not [string]::IsNullOrWhiteSpace($env:PAN123_WEBDAV_PASS))
          $hasOpen = (-not [string]::IsNullOrWhiteSpace($env:PAN123_CLIENT_ID)) -and
                     (-not [string]::IsNullOrWhiteSpace($env:PAN123_CLIENT_SECRET))

          if (-not $hasWebdav -and -not $hasOpen) {
              Write-Host "::notice::未配置 123 云盘凭据（PAN123_WEBDAV_* 或 PAN123_CLIENT_ID/SECRET），跳过上传"
              exit 0
          }

          python -m pip install --quiet --disable-pip-version-check requests

          $files = @()
          foreach ($path in @($env:ARCHIVE, $env:SETUP)) {
              if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path $path)) {
                  $files += @("--file", (Split-Path $path -Leaf))
              }
          }
          if ($files.Count -eq 0) { Write-Host "没有找到要上传的产物"; exit 0 }

          if ($hasWebdav) {
              # WebDAV：MKCOL 逐级建目录 + 流式 PUT，内存占用与包体大小无关
              # 云盘侧固定落在 BGI.special 目录下，按版本再分一层，避免和历史版本混在根目录
              $root = if ([string]::IsNullOrWhiteSpace($env:PAN123_WEBDAV_ROOT)) { "/BGI.special" } else { $env:PAN123_WEBDAV_ROOT.Trim() }
              $root = $root.TrimEnd("/")
              $remote = "$root/$($env:VERSION)"
              Write-Host "走 WebDAV，远端目录：$remote"
              $arguments = @("tools/bgi-special/upload_123pan_webdav.py", "--dir", "dist", "--remote", $remote) + $files
              Write-Host "执行：python $($arguments -join ' ')"
              python @arguments
              if ($LASTEXITCODE -ne 0) { throw "123 云盘 WebDAV 上传失败，退出码 $LASTEXITCODE" }
          }
          else {
              # 开放平台：clientID/clientSecret 换 token 后分片上传
              # 目录默认按名字在根目录找 BGI.special；要指定别处就配 PAN123_PARENT_ID
              $parentArgs = @("--parent-name", "BGI.special")
              if (-not [string]::IsNullOrWhiteSpace($env:PAN123_PARENT_ID)) {
                  $parentArgs = @("--parent-id", $env:PAN123_PARENT_ID.Trim())
              }
              Write-Host "走开放平台 API，目标目录：$($parentArgs -join ' ')"
              $arguments = @("tools/bgi-special/upload_123pan.py", "--dir", "dist") + $parentArgs + $files
              Write-Host "执行：python $($arguments -join ' ')"
              python @arguments
              if ($LASTEXITCODE -ne 0) { throw "123 云盘开放平台上传失败，退出码 $LASTEXITCODE" }
          }

      - name: 写入运行摘要
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            "| 项目 | 值 |",
            "| --- | --- |",
            "| 版本 | ${{ steps.ver.outputs.version }} |",
            "| 上游基线 | ${{ steps.ver.outputs.base }} |",
            "| 源码 ref | ${{ inputs.ref || github.ref_name }} |",
            "| 压缩包 | ${{ steps.pack.outputs.archive }} |",
            "| 体积 | ${{ steps.pack.outputs.sizeMB }} MB |",
            "| 安装包 | ${{ steps.sfx.outputs.setup }} |",
            "| 安装包体积 | ${{ steps.sfx.outputs.setupMB }} MB |"
          )
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

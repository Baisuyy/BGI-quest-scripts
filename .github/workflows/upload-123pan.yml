name: 补传 123 云盘

# 只做一件事：把已经发到 Release 的包再镜像一份到 123 云盘。
# 为什么单独留一个：正式发布那一步是 continue-on-error 的，凭据没配好、或者当时网络不行，
# 传失败了也不会拦住发布，事后想补就得重跑整轮 40 分钟的构建。这里直接拉 Release 资产，
# 两分钟传完，不动版本、不动 Release 说明。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.67.0-special.7.5
        required: true
        type: string
      parent_id:
        description: 可选：开放平台的父目录 ID，留空按名字找 BGI.special
        required: false
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 从 Release 下载资产
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "special-v$VERSION" \
            --pattern "*special-win-x64.7z" \
            --pattern "*.Install.*.exe" \
            --dir dist
          echo "下载完成："
          ls -lh dist

      - name: 上传到 123 云盘
        env:
          PAN123_WEBDAV_USER: ${{ secrets.PAN123_WEBDAV_USER }}
          PAN123_WEBDAV_PASS: ${{ secrets.PAN123_WEBDAV_PASS }}
          PAN123_WEBDAV_URL: ${{ secrets.PAN123_WEBDAV_URL }}
          PAN123_WEBDAV_ROOT: ${{ secrets.PAN123_WEBDAV_ROOT }}
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
          PAN123_PARENT_ID: ${{ secrets.PAN123_PARENT_ID }}
          PARENT_ID_INPUT: ${{ inputs.parent_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          files=()
          names=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            files+=(--file "$(basename "$f")")
            names+=("$(basename "$f")")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist 里没有可上传的文件，检查 Release 是否还留着资产"
            exit 1
          fi

          python3 -m pip install --quiet requests

          if [ -n "${PAN123_WEBDAV_USER:-}" ] && [ -n "${PAN123_WEBDAV_PASS:-}" ]; then
            root="${PAN123_WEBDAV_ROOT:-/BGI.special}"
            root="${root%/}"
            remote="$root/$VERSION"
            echo "走 WebDAV，远端目录：$remote"
            python3 tools/bgi-special/upload_123pan_webdav.py --dir dist --remote "$remote" "${files[@]}"
            echo "### 123 云盘：已上传 \`$VERSION\`（WebDAV → \`$remote\`）" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${PAN123_CLIENT_ID:-}" ] && [ -n "${PAN123_CLIENT_SECRET:-}" ]; then
            parent_args=(--parent-name BGI.special)
            if [ -n "${PARENT_ID_INPUT:-}" ]; then
              parent_args=(--parent-id "$PARENT_ID_INPUT")
            elif [ -n "${PAN123_PARENT_ID:-}" ]; then
              parent_args=(--parent-id "$PAN123_PARENT_ID")
            fi
            echo "走开放平台，目录参数：${parent_args[*]}"
            python3 tools/bgi-special/upload_123pan.py --dir dist "${parent_args[@]}" "${files[@]}"
            echo "### 123 云盘：已上传 \`$VERSION\`（开放平台 → \`BGI.special\`）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::没有 123 云盘凭据。在仓库 Secrets 里配 PAN123_CLIENT_ID / PAN123_CLIENT_SECRET，或 PAN123_WEBDAV_USER / PAN123_WEBDAV_PASS"
            exit 1
          fi

          printf '上传的文件：\n' >> "$GITHUB_STEP_SUMMARY"
          for n in "${names[@]}"; do
            printf -- '- %s\n' "$n" >> "$GITHUB_STEP_SUMMARY"
          done

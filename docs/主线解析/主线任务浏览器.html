<style>
:root{
  --bg:#f7f6f3; --card:#fff; --line:#e3e0d8; --ink:#1f1e1c; --ink2:#5c5850; --ink3:#8c867a;
  --gold:#b8893b; --blue:#2f4a6d; --red:#a8452f; --shadow:0 1px 2px rgba(31,30,28,.06),0 4px 16px rgba(31,30,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
header{
  padding:44px 40px 28px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fffdf8 0%,var(--bg) 100%);
}
h1{margin:0 0 6px; font-size:26px; letter-spacing:.5px; font-weight:650}
.sub{color:var(--ink3); font-size:13px; letter-spacing:.3px}
.stats{display:flex; gap:36px; margin-top:22px; flex-wrap:wrap}
.stat b{display:block; font-size:25px; font-weight:600; color:var(--blue); font-variant-numeric:tabular-nums; line-height:1.2}
.stat span{font-size:12px; color:var(--ink3)}
.layout{display:flex; align-items:flex-start; max-width:1500px; margin:0 auto}
aside{
  position:sticky; top:0; width:262px; flex:0 0 262px; max-height:100vh; overflow-y:auto;
  padding:24px 0 40px 22px; font-size:12.5px; border-right:1px solid var(--line);
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:#d8d3c7;border-radius:3px}
.nav-arc{font-weight:600; color:var(--ink); margin:16px 0 5px; font-size:12px; letter-spacing:.6px}
.nav-arc:first-child{margin-top:0}
.nav-item{display:block; padding:3px 8px; margin-right:10px; border-radius:4px; color:var(--ink2); transition:.12s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-item:hover{background:#edeae2; color:var(--ink)}
.nav-item.active{background:#e8e2d4; color:var(--ink); font-weight:500}
main{flex:1; min-width:0; padding:24px 40px 80px}
.toolbar{display:flex; gap:10px; align-items:center; margin-bottom:24px; flex-wrap:wrap}
input[type=search]{
  flex:1; min-width:220px; max-width:380px; padding:9px 13px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); font-size:13px; outline:none; transition:.15s;
}
input[type=search]:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,137,59,.12)}
.chip{
  padding:6px 12px; border:1px solid var(--line); border-radius:20px; background:var(--card);
  font-size:12px; color:var(--ink2); cursor:pointer; user-select:none;
}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.arc-title{
  font-size:13px; letter-spacing:2px; color:var(--gold); font-weight:600;
  margin:40px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);
}
.arc-title:first-of-type{margin-top:0}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden}
.card-h{padding:14px 18px 12px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; border-bottom:1px solid #f0ede6}
.act{font-size:12px; color:var(--ink3); letter-spacing:.5px}
.card-h h3{margin:0; font-size:15px; font-weight:600}
.cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--ink3); background:#f4f1ea; padding:1px 6px; border-radius:4px}
.meta{margin-left:auto; font-size:11.5px; color:var(--ink3); display:flex; gap:14px; align-items:center}
.bar{width:64px; height:4px; background:#eee9de; border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--gold); border-radius:2px}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{
  text-align:left; padding:8px 18px; font-weight:500; color:var(--ink3); font-size:11px;
  letter-spacing:.5px; border-bottom:1px solid #f0ede6; background:#faf8f3;
}
th.n,td.n{text-align:right; font-variant-numeric:tabular-nums}
td{padding:7px 18px; border-bottom:1px solid #f5f2ec; vertical-align:top}
tr:last-child td{border-bottom:none}
tr.hid td{color:var(--ink3); font-style:italic}
tr.hid .nm::after{content:"隐藏"; font-size:10px; font-style:normal; margin-left:7px; padding:1px 5px; border:1px solid #ded7c8; border-radius:3px; color:var(--ink3)}
tr:hover td{background:#fcfaf6}
.nm{font-weight:500}
.qid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink3); font-size:11.5px}
.preq{color:var(--ink3); font-size:11px}
.zero{color:#c9c2b3}
.empty{padding:60px 0; text-align:center; color:var(--ink3)}
footer{max-width:1500px; margin:0 auto; padding:28px 40px 60px; border-top:1px solid var(--line); color:var(--ink3); font-size:12px}
@media(max-width:860px){
  aside{display:none} main{padding:20px 18px 60px} header{padding:32px 20px 22px}
  th,td{padding-left:12px;padding-right:12px} .meta{width:100%; margin-left:0}
}
</style>
</head>

let kw = "", onlyHid = false, onlyNoCoord = false;

function cov(c, s){ if(!s) return 0; return Math.round(c/s*100); }

function render(){
  const body = document.getElementById('body');
  const nav = document.getElementById('nav');
  let html = "", navHtml = "", lastArc = "";
  let shown = 0;
  DATA.chapters.forEach(ch => {
    const q = kw.trim().toLowerCase();
    const tasks = ch.tasks.filter(t => {
      if(onlyHid && !t.h) return false;
      if(onlyNoCoord && t.c > 0) return false;
      if(q){
        const hay = (t.t + " " + t.id + " " + ch.act + " " + ch.title + " " + ch.region).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    if(!tasks.length) return;
    shown += tasks.length;
    if(ch.arc !== lastArc){
      html += `<div class="arc-title">${ch.arc}</div>`;
      navHtml += `<div class="nav-arc">${ch.arc}</div>`;
      lastArc = ch.arc;
    }
    navHtml += `<a class="nav-item" href="#c${ch.id}">${ch.act} · ${ch.title}</a>`;
    const pct = cov(ch.coords, ch.subs);
    html += `<section class="card" id="c${ch.id}">
      <div class="card-h">
        <span class="act">${ch.act}</span>
        <h3>${ch.title}</h3>
        <span class="cid">${ch.id}</span>
        <div class="meta">
          <span>${ch.tasks.length} 任务 · ${ch.subs} 步</span>
          <span>坐标 ${ch.coords}</span>
          <span class="bar"><i style="width:${pct}%"></i></span>
        </div>
      </div>
      <table>
        <thead><tr><th class="n" style="width:44px">序</th><th style="width:64px">ID</th><th>任务</th><th class="n" style="width:66px">步骤</th><th class="n" style="width:60px">对白</th><th class="n" style="width:60px">坐标</th><th style="width:110px">前置</th></tr></thead>
        <tbody>${tasks.map(t => `<tr class="${t.h?'hid':''}">
          <td class="n zero">${t.seq}</td>
          <td class="qid">${t.id}</td>
          <td class="nm">${t.t}</td>
          <td class="n">${t.s}</td>
          <td class="n ${t.d?'':'zero'}">${t.d||'—'}</td>
          <td class="n ${t.c?'':'zero'}">${t.c||'—'}</td>
          <td class="preq">${t.p||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </section>`;
  });
  document.getElementById('body').innerHTML = html || '<div class="empty">没有匹配的任务</div>';
  document.getElementById('nav').innerHTML = navHtml;
  document.querySelectorAll('.nav-item').forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth', block:'start'});
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
      a.classList.add('active');
    };
  });
}

document.getElementById('q').addEventListener('input', e => { kw = e.target.value; render(); });
document.getElementById('f-hid').onclick = e => { onlyHid = !onlyHid; e.target.classList.toggle('on', onlyHid); render(); };
document.getElementById('f-noc').onclick = e => { onlyNoCoord = !onlyNoCoord; e.target.classList.toggle('on', onlyNoCoord); render(); };
render();
</script>
